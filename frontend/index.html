<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      内联 SVG 图标而不是放一个 favicon.ico 文件：省掉一次请求，也避免浏览器
      按默认路径请求 /favicon.ico 时在控制台留下一条 404——验收时打开开发者工具
      看到的第一条红色记录不该是图标缺失。
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 10h9M9 16h14M9 22h11' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>智能在线题库与组卷系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
